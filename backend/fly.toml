# fly.toml app configuration file generated for chatterbot-backend on 2026-11-11T01:45:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chatterbot-backend'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  CB_LLM_PRIMARY = 'gemini'
  CB_LOG_LEVEL = 'INFO'
  CB_TTS_BACKEND = 'piper'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/readyz'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '4gb'
