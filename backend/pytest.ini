[pytest]
# Pytest configuration for the Chatterbot-AI backend (IMPLEMENTATION.md §21).
# Pure-logic tests run anywhere; benchmark/e2e tests need the heavy models and are
# opt-in via their markers.
asyncio_mode = auto
testpaths = tests
markers =
    benchmark: component benchmarks needing heavy models (run in-container)
    e2e: end-to-end latency tests needing all models + a live LLM
