# Chatterbot-AI orchestration (IMPLEMENTATION.md §22.2).
# Single-instance backend + optional self-hosted LiveKit + optional Ollama fallback.
# Use LiveKit Cloud instead by dropping the `livekit` service and pointing
# CB_LIVEKIT_URL at the cloud endpoint.
#
# Run from the repo root:  docker compose -f docker/docker-compose.yml up --build
# With the self-hosted server below, set in backend/.env:
#   CB_LIVEKIT_URL=ws://livekit:7880            (backend -> server, inside compose)
#   CB_LIVEKIT_PUBLIC_URL=ws://localhost:7880   (URL handed to the browser)
#   CB_LIVEKIT_API_KEY=devkey  CB_LIVEKIT_API_SECRET=secret   (--dev defaults)

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    volumes:
      # Same locations a local run uses (backend/data, repo-root models/), so jobs
      # and the ~570 MB model cache are shared between local and container runs.
      - ../backend/data:/app/data
      - ../models:/models
    depends_on:
      - livekit

  # Self-hosted WebRTC signaling/media (omit if using LiveKit Cloud).
  livekit:
    image: livekit/livekit-server:v1.8
    command: --dev --bind 0.0.0.0   # dev mode (devkey/secret); supply a config + keys for production
    ports:
      - "7880:7880"         # signaling (ws)
      - "7881:7881"         # rtc/tcp
      - "7882:7882/udp"     # rtc/udp

  # Optional local LLM fallback (IMPLEMENTATION.md §18.3). Uncomment to enable.
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ./ollama:/root/.ollama
